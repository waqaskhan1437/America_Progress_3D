name: Render 3D America Progress Video
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip python3-pil

      - name: Generate High-Quality 2-Minute Video
        run: |
          python3 << 'PYTHON_EOF'
          from PIL import Image, ImageDraw
          import os
          import math

          os.makedirs("/tmp/frames", exist_ok=True)

          # Generate 240 frames for 2 minutes at 2fps (slower for better quality)
          total_frames = 240
          
          scenes = [
              (1, 20, "1607", "Colonial Beginning\nJamestown, Virginia", (40, 20, 10)),
              (21, 40, "1607-1733", "13 Colonies\nMassachusetts to Georgia", (50, 30, 20)),
              (41, 60, "1776", "Independence\nDeclaration of Independence", (60, 50, 30)),
              (61, 80, "1803", "Louisiana Purchase\n$15 Million - Nation Doubled", (40, 70, 30)),
              (81, 100, "1849", "Westward Expansion\nManifest Destiny", (80, 60, 40)),
              (101, 120, "1865", "Civil War Ends\nReconstruction", (70, 50, 50)),
              (121, 140, "1900", "Industrial Revolution\nFactories & Railroads", (90, 70, 50)),
              (141, 160, "1920", "Roaring Twenties\nJazz & Prosperity", (100, 80, 60)),
              (161, 180, "1945", "World War II\nAllied Victory", (80, 80, 70)),
              (181, 200, "1960", "Post-War Boom\nSuburbs & Highways", (90, 100, 120)),
              (201, 220, "2000", "Digital Age\nInternet & Technology", (70, 90, 140)),
              (221, 240, "2024", "Modern America\nInnovation Leader", (60, 110, 130)),
          ]

          factors = ["🏭 Industrial Innovation", "🌍 Immigration & Diversity", "⛽ Natural Resources", 
                    "🎓 Education & Research", "⚖️ Democratic Governance", "💰 Capital Investment"]

          # Pre-render globe base (static, just draw once)
          base_globe = Image.new('RGB', (1280, 720), (10, 10, 20))
          draw = ImageDraw.Draw(base_globe)
          
          # Draw globe circle
          cx, cy, size = 640, 340, 180
          draw.ellipse([cx-size, cy-size, cx+size, cy+size], fill=(5, 30, 80))
          draw.ellipse([cx-size, cy-size, cx+size, cy+size], outline=(50, 100, 180), width=3)
          
          # Draw continents (simplified)
          continents = [(-100, 40, 60, 50), (-60, -10, 40, 55), (20, 40, 70, 50), (70, 30, 90, 65)]
          for lx, ly, lw, lh in continents:
              draw.ellipse([cx+lx-lw//2, cy+ly-lh//2, cx+lx+lw//2, cy+ly+lh//2], fill=(20, 70, 35))

          print("Generating 240 frames...")

          for frame in range(1, total_frames + 1):
              # Find current scene
              current = scenes[-1]
              for s in scenes:
                  if s[0] <= frame <= s[1]:
                      current = s
                      break
              
              start_f, end_f, year, desc, bg = current
              progress = frame / total_frames
              
              # Copy base and modify
              img = base_globe.copy()
              draw = ImageDraw.Draw(img)
              
              # Add glow effect around globe
              for r in range(200, 240, 8):
                  draw.ellipse([cx-r, cy-r, cx+r, cy+r], outline=(80, 120, 200, 40))
              
              # Draw city dots based on era (more cities in later frames)
              num_cities = 3 + int((frame / total_frames) * 8)
              city_positions = [
                  (-74, 40), (-87, 41), (-118, 34), (-77, 38), (-122, 37), 
                  (-80, 25), (-71, 42), (-84, 33), (2.35, 48.85), (139.69, 35.68)
              ][:num_cities]
              
              for lon, lat in city_positions:
                  x = cx + int(lon * 2.8)
                  y = cy - int(lat * 2.2)
                  # Add glow
                  draw.ellipse([x-10, y-10, x+10, y+10], fill=(255, 50, 50, 80))
                  draw.ellipse([x-4, y-4, x+4, y+4], fill=(255, 80, 80))
              
              # Add scene text
              draw.text((cx, 80), year, fill=(255, 220, 0), anchor="mm")
              draw.text((cx, 120), desc, fill=(200, 200, 200), anchor="mm")
              
              # Add progress bar
              bar_w = 800
              draw.rectangle([cx-bar_w//2, 680, cx+bar_w//2, 690], fill=(30, 30, 30))
              draw.rectangle([cx-bar_w//2, 680, cx-bar_w//2 + int(bar_w * progress), 690], fill=(255, 220, 0))
              
              # Add factors (after frame 40)
              if frame > 40:
                  for i, f in enumerate(factors):
                      draw.text((30, 100 + i * 25), f, fill=(150, 150, 150))
              
              # Add chapter
              chapter = (frame // 20) + 1
              draw.text((1200, 30), f"Ch {chapter}/6", fill=(100, 100, 100), anchor="rm")
              
              # Add time
              secs = frame // 2
              mins = secs // 60
              secs = secs % 60
              draw.text((1180, 690), f"{mins:02d}:{secs:02d}", fill=(100, 100, 100), anchor="rm")
              
              # Save
              img.save(f"/tmp/frames/frame_{frame:04d}.png", quality=90)
              
              if frame % 40 == 0:
                  print(f"  {frame}/{total_frames}")

          print(f"Done! {len(os.listdir('/tmp/frames'))} frames")
          PYTHON_EOF

      - name: Create Video with FFmpeg
        run: |
          ls /tmp/frames/ | wc -l
          cd /tmp/frames
          ffmpeg -y -framerate 2 -i frame_%04d.png -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p /tmp/america_progress.mp4
          ls -lh /tmp/america_progress.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: america-progress-3d
          path: /tmp/america_progress.mp4