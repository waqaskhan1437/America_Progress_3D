name: Render Dynamic Video

on:
  workflow_dispatch:
    inputs:
      video_title:
        description: 'Video Title'
        required: true
        default: 'Dynamic Video'
      video_script:
        description: 'Video Script JSON'
        required: true
        default: '{"title":"Dynamic Video","scenes":[{"title":"Welcome","description":"Amazing video","keywords":["star"]}],"duration":30}'

env:
  VIDEO_SCRIPT: ${{ github.event.inputs.video_script }}
  VIDEO_TITLE: ${{ github.event.inputs.video_title }}

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip

      - name: Install Python dependencies
        run: |
          pip3 install pillow edge-tts requests

      - name: Save Script JSON
        run: |
          echo '${{ github.event.inputs.video_script }}' > script.json
          cat script.json

      - name: Generate TTS Audio (if enabled)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 scripts/tts_generator.py script.json || echo "TTS skipped or not enabled"

      - name: Generate Video
        run: python3 generate_video.py

      - name: Create Video with FFmpeg
        run: |
          cd /tmp/frames
          ffmpeg -y -framerate 30 -i frame_%05d.png -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p /tmp/output_video.mp4
          ls -lh /tmp/output_video.mp4

      - name: Upload to catbox.moe
        id: catbox
        run: |
          # Try litterbox first (72h temp hosting, more reliable)
          echo "Uploading to litterbox (72h)..."
          response=$(curl -s -X POST \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@/tmp/output_video.mp4" \
            https://litterbox.catbox.moe/resources/internals/api.php 2>/dev/null || echo "FAILED")
          
          echo "Litterbox response: $response"
          
          if [[ "$response" == http* ]]; then
            echo "VIDEO_URL=$response" >> $GITHUB_OUTPUT
          else
            # Fallback: try catbox permanent
            echo "Trying catbox permanent..."
            response2=$(curl -s -X POST \
              -F "reqtype=fileupload" \
              -F "fileToUpload=@/tmp/output_video.mp4" \
              https://catbox.moe/user/api.php 2>/dev/null || echo "FAILED")
            echo "Catbox response: $response2"
            if [[ "$response2" == http* ]]; then
              echo "VIDEO_URL=$response2" >> $GITHUB_OUTPUT
            else
              echo "VIDEO_URL=UPLOAD_FAILED" >> $GITHUB_OUTPUT
              echo "Both upload services failed"
            fi
          fi

      - name: Upload to GitHub Artifacts
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: /tmp/output_video.mp4
          retention-days: 30

      - name: Create Video Info
        run: |
          echo "Title: ${{ env.VIDEO_TITLE }}" > video_info.txt
          echo "Catbox: ${{ steps.catbox.outputs.VIDEO_URL }}" >> video_info.txt
          echo "ArtifactID: ${{ steps.artifact.outputs.artifact-id }}" >> video_info.txt
          echo "RunID: ${{ github.run_id }}" >> video_info.txt
          echo "Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.artifact.outputs.artifact-id }}" >> video_info.txt
          cat video_info.txt

      - name: Display Result
        run: |
          echo "=========================================="
          echo "Title: ${{ env.VIDEO_TITLE }}"
          echo "Catbox URL: ${{ steps.catbox.outputs.VIDEO_URL }}"
          echo "Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.artifact.outputs.artifact-id }}"
          echo "=========================================="
