name: Render Dynamic Video

on:
  workflow_dispatch:
    inputs:
      video_title:
        description: 'Video Title'
        required: true
        default: 'Dynamic Video'
      video_script:
        description: 'Video Script JSON'
        required: true
        default: '{"title":"Dynamic Video","scenes":[{"title":"Welcome","description":"Amazing animated video","keywords":["star","celebrate"]},{"title":"Explore","description":"Discover new horizons","keywords":["globe","world"]},{"title":"Achieve","description":"Reach for the stars","keywords":["rocket","start"]},{"title":"Celebrate","description":"Success and joy","keywords":["celebration","heart"]}],"duration":30}'

env:
  VIDEO_SCRIPT: ${{ github.event.inputs.video_script }}

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip

      - name: Install Python dependencies
        run: pip3 install pillow

      - name: Generate Video
        run: python3 generate_video.py

      - name: Create Video with FFmpeg
        run: |
          cd /tmp/frames
          ffmpeg -y -framerate 30 -i frame_%05d.png -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p /tmp/output_video.mp4
          ls -lh /tmp/output_video.mp4

      - name: Upload to Catbox
        id: catbox
        run: |
          curl -X POST -F "reqtype=fileupload" -F "time=1d" -F "fileToUpload=@/tmp/output_video.mp4" https://catbox.moe/user/api.php > video_url.txt
          cat video_url.txt
          echo "VIDEO_URL=$(cat video_url.txt)" >> $GITHUB_ENV

      - name: Display Result
        run: |
          echo "=========================================="
          echo "Video Title: ${{ github.event.inputs.video_title }}"
          echo "Video URL: ${{ env.VIDEO_URL }}"
          echo "=========================================="

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: /tmp/output_video.mp4
          retention-days: 7
