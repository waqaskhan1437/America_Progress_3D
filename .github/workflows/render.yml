name: Render Dynamic Video

on:
  workflow_dispatch:
    inputs:
      video_title:
        description: 'Video Title'
        required: true
        default: 'Dynamic Video'
      video_script:
        description: 'Video Script JSON'
        required: true
        default: '{"title":"Dynamic Video","scenes":[{"title":"Welcome","description":"Amazing animated video","keywords":["star","celebrate"]}],"duration":30}'

env:
  VIDEO_SCRIPT: ${{ github.event.inputs.video_script }}
  VIDEO_TITLE: ${{ github.event.inputs.video_title }}

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip

      - name: Install Python dependencies
        run: pip3 install pillow

      - name: Generate Video
        run: python3 generate_video.py

      - name: Create Video with FFmpeg
        run: |
          cd /tmp/frames
          ffmpeg -y -framerate 30 -i frame_%05d.png -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p /tmp/output_video.mp4
          ls -lh /tmp/output_video.mp4

      - name: Upload to Catbox (Anonymous)
        id: catbox
        run: |
          # Try catbox with longer timeout
          response=$(curl -s -X POST \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@/tmp/output_video.mp4" \
            --connect-timeout 30 \
            --max-time 120 \
            https://catbox.moe/user/api.php)
          
          if echo "$response" | grep -q "catbox.moe"; then
            echo "VIDEO_URL=$response" >> $GITHUB_ENV
            echo "Catbox URL: $response"
          else
            echo "Catbox upload response: $response"
            echo "VIDEO_URL=" >> $GITHUB_ENV
          fi

      - name: Upload to GitHub Artifacts
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}-${{ github.run_id }}
          path: /tmp/output_video.mp4
          retention-days: 7

      - name: Create Output File
        run: |
          mkdir -p output
          echo "Title: ${{ env.VIDEO_TITLE }}" > output/video_info.txt
          echo "Catbox: ${{ env.VIDEO_URL }}" >> output/video_info.txt
          echo "Artifact: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.artifact.outputs.artifact-id }}" >> output/video_info.txt
          echo "Run ID: ${{ github.run_id }}" >> output/video_info.txt
          echo "Artifact ID: ${{ steps.artifact.outputs.artifact-id }}" >> output/video_info.txt
          
      - name: Upload Video Info
        uses: actions/upload-artifact@v4
        with:
          name: video-info
          path: output/video_info.txt
          retention-days: 7

      - name: Display Result
        run: |
          echo "=========================================="
          echo "Video Title: ${{ env.VIDEO_TITLE }}"
          echo "Catbox URL: ${{ env.VIDEO_URL }}"
          echo "Artifact ID: ${{ steps.artifact.outputs.artifact-id }}"
          echo "=========================================="
