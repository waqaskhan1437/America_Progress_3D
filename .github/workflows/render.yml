name: Render 3D America Progress Video
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip python3-pil

      - name: Install Python packages
        run: pip install pillow numpy

      - name: Generate 3D Frame Images
        run: |
          python3 << 'PYTHON_EOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          # Create output directory
          os.makedirs("/tmp/frames", exist_ok=True)

          # Timeline data with colors
          timeline = [
              (1, "1607: Colonial Beginning\nJamestown, Virginia", (139, 69, 19)),
              (60, "1776: Independence\nDeclaration of Independence", (70, 130, 180)),
              (120, "1803: Louisiana Purchase\nNation Doubled", (34, 139, 34)),
              (180, "1865: Civil War Ends\nReconstruction", (128, 128, 128)),
              (240, "1900: Industrial Power\nFactories & Railroads", (255, 140, 0)),
              (300, "1950: World Superpower\nPost-WWII Era", (0, 100, 200)),
              (360, "2024: Modern America\nTechnology & Innovation", (0, 200, 100)),
          ]

          # Development factors text
          factors = [
              "• Industrial Innovation",
              "• Immigration & Diversity", 
              "• Natural Resources",
              "• Education & Research",
              "• Democratic Governance",
              "• Capital Investment"
          ]

          # Create frames for each timeline point
          for frame_num, (frame_id, text, color) in enumerate(timeline):
              # Create image with dark background
              img = Image.new('RGB', (1280, 720), (10, 15, 30))
              draw = ImageDraw.Draw(img)

              # Draw globe (simple circle representation)
              center_x, center_y = 640, 360
              radius = 200
              
              # Ocean
              draw.ellipse([center_x - radius, center_y - radius, 
                          center_x + radius, center_y + radius], 
                         fill=(20, 60, 120))
              
              # Land masses (simplified)
              land_positions = [
                  (-80, 35, 50, 40),   # North America
                  (-50, -10, 40, 60),  # South America  
                  (10, 40, 70, 50),    # Europe
                  (50, 30, 100, 70),   # Asia/Africa
              ]
              for lx, ly, lw, lh in land_positions:
                  draw.ellipse([center_x + lx - lw//2, center_y + ly - lh//2,
                               center_x + lx + lw//2, center_y + ly + lh//2],
                              fill=(30, 100, 40))

              # City markers (red dots)
              cities = [
                  (-74, 40, "New York"),
                  (-118, 34, "Los Angeles"),
                  (-87, 41, "Chicago"),
                  (-77, 38, "Washington"),
              ]
              for lon, lat, name in cities:
                  # Convert lat/lon to position
                  x = center_x + int(lon * 2.5)
                  y = center_y - int(lat * 2.5)
                  draw.ellipse([x-6, y-6, x+6, y+6], fill=(255, 50, 50))

              # Draw timeline text
              draw.text((center_x, 550), text, fill=color, anchor="mm")

              # Draw factors on left side
              for i, factor in enumerate(factors):
                  draw.text((50, 100 + i * 35), factor, fill=(180, 180, 180))

              # Draw title
              draw.text((center_x, 50), "THE RISE OF AMERICA", fill=(255, 215, 0), anchor="mm")
              
              # Draw frame number
              draw.text((1180, 680), f"Frame {frame_id}", fill=(100, 100, 100))

              # Save frame
              img.save(f"/tmp/frames/frame_{frame_id:04d}.png")

          print("Generated 8 keyframe images!")

          # List frames
          for f in sorted(os.listdir("/tmp/frames")):
              print(f"  {f}")
          PYTHON_EOF

      - name: Create Video with FFmpeg
        run: |
          ls /tmp/frames/
          cd /tmp/frames
          ffmpeg -framerate 2 -i frame_%04d.png -c:v libx264 -pix_fmt yuv420p -y /tmp/america_progress.mp4
          ls -la /tmp/america_progress.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: america-progress-3d
          path: /tmp/america_progress.mp4