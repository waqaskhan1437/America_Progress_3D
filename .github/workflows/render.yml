name: Render 3D America Progress Video
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg wget unzip libegl1 libgl1

      - name: Generate 3D Globe
        run: echo "Skipping - creating globe in scene step"

      - name: Create America Progress Scene
        run: |
          cat > /tmp/create_scene.py << 'PYTHON_EOF'
          import bpy
          import math

          # Clear existing scene
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete()

          # Set render engine to EEVEE (not Cycles)
          bpy.context.scene.render.engine = 'BLENDER_EEVEE'

          # Create globe
          bpy.ops.mesh.primitive_ico_sphere_add(subdivisions=4, radius=4, location=(0, 0, 0))
          globe = bpy.context.object
          globe.name = "Globe"
          
          # Blue ocean material
          mat = bpy.data.materials.new(name="Ocean")
          mat.use_nodes = True
          bsdf = mat.node_tree.nodes.get("Principled BSDF")
          bsdf.inputs[0].default_value = (0.05, 0.15, 0.35, 1)
          globe.data.materials.append(mat)

          # Animate globe rotation
          globe.rotation_euler = (0, 0, 0)
          globe.keyframe_insert(data_path="rotation_euler", frame=1)
          globe.rotation_euler = (0, 0, math.radians(360))
          globe.keyframe_insert(data_path="rotation_euler", frame=420)

          # Timeline text
          timeline_data = [
              (1, 60, "1607: Colonial Beginning\nJamestown, Virginia"),
              (61, 120, "1776: Independence\nDeclaration of Independence"),
              (121, 180, "1803: Louisiana Purchase\nDoubled the nation"),
              (181, 240, "1865: Civil War Ends"),
              (241, 300, "1900: Industrial Power\nFactories"),
              (301, 360, "1950: World Superpower"),
              (361, 420, "2024: Modern America")
          ]

          for frame_start, frame_end, text in timeline_data:
              bpy.ops.object.text_add()
              txt = bpy.context.object
              txt.data.body = text
              txt.location = (0, 0, 6)
              txt.rotation_euler = (math.radians(90), 0, 0)
              txt.scale = (0.4, 0.4, 0.4)
              txt.data.align_x = 'CENTER'
              txt.data.size = 0.5
              
              txt.hide_viewport = True
              txt.keyframe_insert(data_path="hide_viewport", frame=1)
              txt.hide_viewport = False
              txt.keyframe_insert(data_path="hide_viewport", frame=frame_start)
              txt.hide_viewport = True
              txt.keyframe_insert(data_path="hide_viewport", frame=frame_end)

          # Camera
          bpy.ops.object.camera_add(location=(0, -15, 8))
          cam = bpy.context.object
          cam.rotation_euler = (math.radians(70), 0, 0)
          bpy.context.scene.camera = cam
          
          cam.location = (15, -15, 8)
          cam.keyframe_insert(data_path="location", frame=1)
          cam.location = (-15, 15, 10)
          cam.keyframe_insert(data_path="location", frame=210)
          cam.location = (0, -18, 12)
          cam.keyframe_insert(data_path="location", frame=420)

          # Light
          bpy.ops.object.light_add(type='SUN', location=(10, 10, 20))
          light = bpy.context.object
          light.data.energy = 3

          # Render settings - USE EEVEE
          bpy.context.scene.render.engine = 'BLENDER_EEVEE'
          bpy.context.scene.render.resolution_x = 1280
          bpy.context.scene.render.resolution_y = 720
          bpy.context.scene.frame_start = 1
          bpy.context.scene.frame_end = 420
          
          # Save scene
          bpy.ops.wm.save_as_mainfile(filepath="/tmp/america_scene.blend")
          print("Scene saved with EEVEE!")
          PYTHON_EOF
          blender -b --python /tmp/create_scene.py

      - name: Create animation script
        run: |
          cat > /tmp/render_animation.py << 'PYTHON_EOF'
          import bpy
          import os
          
          # Ensure output directory exists
          os.makedirs("/tmp/frames", exist_ok=True)
          
          # Render animation
          bpy.ops.render.render(animation=True)
          
          print("Rendering complete!")
          PYTHON_EOF

      - name: Run Blender Scene Creation
        run: blender -b --python /tmp/create_scene.py

      - name: Render Animation Frames
        run: |
          # Render keyframes only to save time and avoid Cycles issues
          blender -b /tmp/america_scene.blend -o /tmp/frame_ -f 1
          blender -b /tmp/america_scene.blend -o /tmp/frame_ -f 60
          blender -b /tmp/america_scene.blend -o /tmp/frame_ -f 120
          blender -b /tmp/america_scene.blend -o /tmp/frame_ -f 180
          blender -b /tmp/america_scene.blend -o /tmp/frame_ -f 240
          blender -b /tmp/america_scene.blend -o /tmp/frame_ -f 300
          blender -b /tmp/america_scene.blend -o /tmp/frame_ -f 360
          blender -b /tmp/america_scene.blend -o /tmp/frame_ -f 420

      - name: Create Video with FFmpeg
        run: |
          # Create video from keyframes (frames 1-420 in steps of 60)
          # We'll duplicate frames to create a smoother video
          ls /tmp/frame_*.png
          ffmpeg -framerate 2 -i /tmp/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -y /tmp/america_progress.mp4 2>/dev/null || \
          ffmpeg -framerate 2 -pattern_type glob -i "/tmp/frame_*.png" -c:v libx264 -pix_fmt yuv420p -y /tmp/america_progress.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: america-progress-3d
          path: /tmp/america_progress.mp4