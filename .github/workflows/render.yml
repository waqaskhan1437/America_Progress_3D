name: Render 3D America Progress Video
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip python3-pil

      - name: Generate High-Quality 2-Minute Video
        run: |
          python3 << 'PYTHON_EOF'
          from PIL import Image, ImageDraw
          import os

          os.makedirs("/tmp/frames", exist_ok=True)
          
          # Generate more frames for longer video
          total_frames = 600  # 5 minutes at 2fps
          
          scenes = [
              (1, 50, "1607", "Colonial Beginning\nJamestown, Virginia"),
              (51, 100, "1776", "Independence\nDeclaration of Independence"),
              (101, 150, "1803", "Louisiana Purchase\nNation Doubled"),
              (151, 200, "1865", "Civil War Ends\nReconstruction"),
              (201, 250, "1900", "Industrial Revolution\nFactories & Railroads"),
              (251, 300, "1920", "Roaring Twenties\nJazz & Prosperity"),
              (301, 350, "1945", "World War II\nAllied Victory"),
              (351, 400, "1960", "Post-War Boom\nSuburbs & Highways"),
              (401, 450, "2000", "Digital Age\nInternet & Technology"),
              (451, 500, "2010", "Modern Era\nTechnology Leaders"),
              (501, 600, "2024", "Modern America\nInnovation Leader"),
          ]

          factors = ["🏭 Industrial Innovation", "🌍 Immigration & Diversity", "⛽ Natural Resources", 
                    "🎓 Education & Research", "⚖️ Democratic Governance", "💰 Capital Investment"]

          # Create base image with dark theme
          base = Image.new('RGB', (1280, 720), (15, 15, 25))
          
          print(f"Generating {total_frames} frames...")
          for frame in range(1, total_frames + 1):
              # Find current scene
              current = scenes[-1]
              for s in scenes:
                  if s[0] <= frame <= s[1]:
                      current = s
                      break
              
              start_f, end_f, year, desc = current
              progress = frame / total_frames
              
              # Copy base
              img = base.copy()
              draw = ImageDraw.Draw(img)
              
              cx, cy, size = 640, 320, 160
              
              # Draw globe
              draw.ellipse([cx-size, cy-size, cx+size, cy+size], fill=(10, 40, 100))
              draw.ellipse([cx-size, cy-size, cx+size, cy+size], outline=(60, 120, 200), width=4)
              
              # Draw continents
              continents = [(-90, 35, 55, 45), (-55, -10, 35, 50), (15, 40, 65, 45), (65, 30, 85, 60)]
              for lx, ly, lw, lh in continents:
                  draw.ellipse([cx+lx-lw//2, cy+ly-lh//2, cx+lx+lw//2, cy+ly+lh//2], fill=(25, 75, 40))
              
              # Add city markers - grow over time
              num_cities = 3 + int((frame / total_frames) * 10)
              cities = [(-74, 40), (-87, 41), (-118, 34), (-77, 38), (-122, 37), 
                       (-80, 25), (-71, 42), (-84, 33), (2.35, 48.85), (139.69, 35.68),
                       (-122, 37), (-0.12, 51.5), (139.69, 35.68)][:num_cities]
              
              for lon, lat in cities:
                  x = cx + int(lon * 2.5)
                  y = cy - int(lat * 2)
                  # Glow
                  draw.ellipse([x-8, y-8, x+8, y+8], fill=(255, 30, 30, 60))
                  draw.ellipse([x-4, y-4, x+4, y+4], fill=(255, 100, 100))
              
              # Draw text
              draw.text((cx, 70), year, fill=(255, 230, 0), anchor="mm", font_size=48)
              draw.text((cx, 110), desc, fill=(200, 200, 200), anchor="mm", font_size=24)
              
              # Progress bar
              bar_w = 900
              draw.rectangle([cx-bar_w//2, 670, cx+bar_w//2, 685], fill=(40, 40, 40))
              draw.rectangle([cx-bar_w//2, 670, cx-bar_w//2 + int(bar_w * progress), 685], fill=(255, 230, 0))
              
              # Factors
              if frame > 50:
                  for i, f in enumerate(factors):
                      draw.text((30, 80 + i * 22), f, fill=(140, 140, 140), font_size=16)
              
              # Chapter
              chapter = frame // 50 + 1
              draw.text((1200, 30), f"Chapter {chapter}/6", fill=(80, 80, 80), anchor="rm", font_size=18)
              
              # Time
              secs = frame // 2
              mins = secs // 60
              secs = secs % 60
              draw.text((1180, 680), f"{mins:02d}:{secs:02d}", fill=(80, 80, 80), anchor="rm", font_size=20)
              
              img.save(f"/tmp/frames/frame_{frame:04d}.png")
              
              if frame % 100 == 0:
                  print(f"  {frame}/{total_frames}")

          print(f"Done! {len(os.listdir('/tmp/frames'))} frames")
          PYTHON_EOF

      - name: Create Video with FFmpeg (Higher Quality)
        run: |
          ls /tmp/frames/ | wc -l
          cd /tmp/frames
          ffmpeg -y -framerate 2 -i frame_%04d.png -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p /tmp/america_progress.mp4 -hide_banner
          ls -lh /tmp/america_progress.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: america-progress-3d
          path: /tmp/america_progress.mp4