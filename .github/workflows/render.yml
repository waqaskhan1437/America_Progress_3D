name: Render 3D America Progress Video
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip libcairo2-dev pkg-config python3-dev

      - name: Install Python packages
        run: pip install manim pillow numpy

      - name: Generate High-Quality 3D Video using Manim
        run: |
          cat > /tmp/america_story.py << 'MANIM_EOF'
          from manim import *
          import numpy as np

          config.pixel_height = 720
          config.pixel_width = 1280
          config.frame_rate = 30

          class AmericaStory(Scene):
              def construct(self):
                  # Title
                  title = Text("THE RISE OF AMERICA", font_size=48, color=GOLD)
                  self.play(Write(title))
                  self.wait(1)
                  self.play(FadeOut(title))
                  
                  # Globe with rotating earth effect
                  globe = Sphere(radius=2, resolution=(30, 30))
                  globe.set_fill(BLUE, opacity=0.3)
                  globe.set_stroke(BLUE_E, opacity=0.5)
                  
                  # Add continents as spheres
                  for lat, lon, size in [(40, -80, 0.3), (34, -118, 0.25), (41, -87, 0.25), (38, -77, 0.2)]:
                      x = 2 * np.cos(lat * TAU / 360) * np.sin(lon * TAU / 360)
                      y = 2 * np.cos(lat * TAU / 360) * np.cos(lon * TAU / 360)
                      z = 2 * np.sin(lat * TAU / 360)
                      city = Sphere(radius=size, resolution=(15, 15)).move_to([x, y, z])
                      city.set_fill(RED)
                      self.add(city)
                  
                  self.play(Create(globe))
                  self.play(Rotate(globe, 4*PI))
                  self.wait()
                  
                  # Timeline scenes
                  scenes = [
                      ("1607", "Colonial Beginning\nJamestown, Virginia"),
                      ("1776", "Independence\nDeclaration of Independence"),
                      ("1803", "Louisiana Purchase\nNation Doubled"),
                      ("1865", "Civil War Ends\nReconstruction"),
                      ("1900", "Industrial Power\nFactories & Railroads"),
                      ("1950", "World Superpower\nPost-WWII Era"),
                      ("2024", "Modern America\nTechnology & Innovation"),
                  ]
                  
                  for year, event in scenes:
                      # Year text
                      year_text = Text(year, font_size=36, color=WHITE).to_edge(UP)
                      # Event text
                      event_text = Text(event, font_size=24, color=YELLOW).to_edge(DOWN)
                      
                      self.play(Write(year_text), run_time=0.5)
                      self.play(Write(event_text), run_time=1)
                      self.wait(2)
                      self.play(FadeOut(year_text), FadeOut(event_text))
                  
                  # Development factors
                  factors = [
                      "Industrial Innovation",
                      "Immigration & Diversity",
                      "Natural Resources",
                      "Education & Research",
                      "Democratic Governance",
                      "Capital Investment"
                  ]
                  
                  factor_group = VGroup(*[Text(f"• {f}", font_size=20, color=GRAY) 
                                        for f in factors]).arrange(DOWN, aligned_left=True).shift(LEFT*3)
                  
                  self.play(Write(factor_group))
                  self.wait(3)
                  
                  # Final title
                  final_title = Text("THE FUTURE AWAITS", font_size=48, color=GOLD)
                  self.play(Write(final_title))
                  self.wait(2)

          MANIM_EOF
          
          # Render with manim (medium quality for speed)
          manim -ql /tmp/america_story.py AmericaStory --output_file america_progress

      - name: Find and Copy Video
        run: |
          find /tmp -name "america_progress*.mp4" 2>/dev/null
          find /tmp -name "*.mp4" 2>/dev/null | head -5

      - name: Convert to Standard Format
        run: |
          # Find the manim output
          OUTPUT_DIR=$(find /tmp -type d -name "*AmericaStory*" 2>/dev/null | head -1)
          if [ -d "$OUTPUT_DIR" ]; then
            VIDEO=$(find $OUTPUT_DIR -name "*.mp4" 2>/dev/null | head -1)
            if [ -n "$VIDEO" ]; then
              cp "$VIDEO" /tmp/america_progress.mp4
              echo "Found: $VIDEO"
            fi
          fi
          
          # Check if video exists
          ls -lh /tmp/america_progress.mp4 2>/dev/null || echo "No video found"
          
          # If still no video, create fallback
          if [ ! -s /tmp/america_progress.mp4 ]; then
             echo "Creating fallback video from images..."
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: america-progress-3d
          path: /tmp/america_progress.mp4