name: Render 3D America Progress Video
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg wget unzip

      - name: Generate 3D Globe
        run: |
          git clone --depth 1 https://github.com/martinbaud/geojsonto3D.git /tmp/geojsonto3D
          cd /tmp/geojsonto3D
          pip install numpy
          python main.py --preset low --enable-cities --enable-border

      - name: Create America Progress Scene
        run: |
          cat > /tmp/create_scene.py << 'PYTHON_EOF'
          import bpy
          import math
          import os

          # Clear existing scene
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete()

          # Import globe
          bpy.ops.import_scene.gltf(filepath="/tmp/geojsonto3D/res/atlas.glb")

          # Create timeline text overlay data
          timeline_data = [
              (1, 60, "1607: Colonial Beginning\nJamestown, Virginia"),
              (61, 120, "1776: Independence\nDeclaration of Independence"),
              (121, 180, "1803: Louisiana Purchase\nDoubled the nation"),
              (181, 240, "1865: Civil War Ends\nReconstruction begins"),
              (241, 300, "1900: Industrial Power\nFactories & Railroads"),
              (301, 360, "1950: World Superpower\nPost-WWII prosperity"),
              (361, 420, "2024: Modern America\nTechnology & Innovation")
          ]

          # Create text objects for timeline
          for frame_start, frame_end, text in timeline_data:
              # Create title text
              bpy.ops.object.text_add()
              text_obj = bpy.context.object
              text_obj.data.body = text
              text_obj.location = (0, 0, 5)
              text_obj.rotation_euler = (math.radians(90), 0, 0)
              text_obj.scale = (0.3, 0.3, 0.3)
              text_obj.data.align_x = 'CENTER'
              text_obj.data.size = 0.5
              
              # Animate text visibility
              text_obj.hide_viewport = True
              text_obj.hide_render = True
              
              for f in range(1, frame_start):
                  text_obj.hide_viewport = True
                  text_obj.keyframe_insert(data_path="hide_viewport", frame=f)
              
              text_obj.hide_viewport = False
              text_obj.keyframe_insert(data_path="hide_viewport", frame=frame_start)
              text_obj.hide_viewport = True
              text_obj.keyframe_insert(data_path="hide_viewport", frame=frame_end)

          # Setup camera
          bpy.ops.object.camera_add(location=(0, -20, 10))
          camera = bpy.context.object
          camera.rotation_euler = (math.radians(75), 0, 0)
          bpy.context.scene.camera = camera
          
          # Animate camera rotation
          camera.location = (20, -20, 10)
          camera.keyframe_insert(data_path="location", frame=1)
          camera.location = (-20, 20, 10)
          camera.keyframe_insert(data_path="location", frame=210)
          camera.location = (0, -25, 15)
          camera.keyframe_insert(data_path="location", frame=420)

          # Add light
          bpy.ops.object.light_add(type='SUN', location=(10, 10, 20))
          light = bpy.context.object
          light.data.energy = 3
          light.rotation_euler = (math.radians(45), math.radians(30), 0)

          # Set render settings
          bpy.context.scene.render.engine = 'CYCLES'
          bpy.context.scene.render.resolution_x = 1280
          bpy.context.scene.render.resolution_y = 720
          bpy.context.scene.render.filepath = "/tmp/frame_"
          bpy.context.scene.frame_start = 1
          bpy.context.scene.frame_end = 420
          
          # Save blend file
          bpy.ops.wm.save_as_mainfile(filepath="/tmp/america_scene.blend")
          
          print("Scene created successfully!")
          PYTHON_EOF

      - name: Create animation script
        run: |
          cat > /tmp/render_animation.py << 'PYTHON_EOF'
          import bpy
          import os
          
          # Ensure output directory exists
          os.makedirs("/tmp/frames", exist_ok=True)
          
          # Render animation
          bpy.ops.render.render(animation=True)
          
          print("Rendering complete!")
          PYTHON_EOF

      - name: Run Blender Scene Creation
        run: blender -b --python /tmp/create_scene.py

      - name: Render Animation Frames
        run: blender -b /tmp/america_scene.blend -a -- --cycles-device CPU

      - name: Create Video with FFmpeg
        run: |
          ffmpeg -framerate 30 -i /tmp/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -y /tmp/america_progress.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: america-progress-3d
          path: /tmp/america_progress.mp4