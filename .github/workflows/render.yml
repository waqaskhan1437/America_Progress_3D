name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      video_title:
        description: 'Title of the video'
        required: true
        default: 'Automated Video'
      video_script:
        description: 'JSON script payload'
        required: true
        
jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Node Dependencies
        run: npm ci
        
      - name: Parse & Save Script
        run: |
          # Save the dispatched script to a local JSON file so Python and Remotion can use it
          echo '${{ github.event.inputs.video_script }}' > script.json

      - name: Install Python Dependencies (TTS)
        run: |
          python -m pip install --upgrade pip
          pip install requests torch TTS "transformers==4.36.2"
          
      - name: Generate Audio Assets (ElevenLabs or OpenSource)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          COQUI_TOS_AGREED: 1
        run: |
          python scripts/tts_generator.py script.json

      - name: Render Video
        run: |
          # Pass the possibly updated script.json to Remotion via environment variables or CLI
          # Note: In standard remotion you can pass props via --props='script.json'
          npx remotion render VideoComposition out/video.mp4 --props=script.json
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/video.mp4
          retention-days: 1
          
      - name: Upload to Catbox (Optional Online Link)
        run: |
          RESPONSE=$(curl -F "reqtype=fileupload" -F "fileToUpload=@out/video.mp4" https://catbox.moe/user/api.php)
          echo "Video uploaded to: $RESPONSE"
